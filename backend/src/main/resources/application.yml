spring:
  profiles:
    active: dev,local
  application:
    name: student-agent

  # MVC 异步请求超时（流式聊天）
  mvc:
    async:
      request-timeout: 300000

  # 文件上传大小限制（学习资料上传）
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  # 数据源配置（MYSQL_HOST 供容器部署覆盖，本地默认 localhost）
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/student_agent?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

# AI 配置（SiliconFlow 硅基流动，OpenAI 兼容，同时支持聊天和Embedding）
# 注意：必须放在顶层 langchain4j 前缀下（starter 的 @ConfigurationProperties 绑定 langchain4j.*），
# 不能放进 spring.* 下，否则 base-url/api-key/model-name 全部绑定不上，模型会默认连 api.openai.com
langchain4j:
  # 聊天模型（阻塞）
  open-ai:
    chat-model:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1
      model-name: deepseek-ai/DeepSeek-V3
      max-tokens: 8192
      # 显式超时：工具循环多轮调用整体耗时较长，避免客户端默认超时过短/无限挂死
      timeout: 90s
      # 调试：打印真实请求/响应报文（定位工具调用格式问题，稳定后关闭）
      log-requests: true
      log-responses: true
    # 流式聊天模型
    streaming-chat-model:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1
      model-name: deepseek-ai/DeepSeek-V3
      max-tokens: 8192
      timeout: 90s
    # Embedding 模型
    embedding-model:
      api-key: ${SILICONFLOW_API_KEY:}
      base-url: https://api.siliconflow.cn/v1
      model-name: Qwen/Qwen3-Embedding-0.6B
      timeout: 30s
  # Chroma 向量库
  chroma:
    base-url: ${CHROMA_BASE_URL:http://localhost:8000}
    collection-name: student_memory

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.studentagent.studentagent.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志级别：默认 INFO；需要排查 OpenAI 请求细节时临时改成 DEBUG
logging:
  level:
    org.springframework.web.client.RestClient: INFO
    dev.langchain4j: INFO

# 服务端口
server:
  port: 8080

# Tavily 联网搜索配置（去 https://tavily.com 注册免费 Key）
tavily:
  api-key: ${TAVILY_API_KEY:}

# 路由 Agent（阶段1：意图路由）——规则优先判 SIMPLE/TOOL，LLM 兜底，失败默认 TOOL（=现状行为）
# 评审 Agent（阶段2：工具结果质检）——规则评审防幻觉/防跨用户泄露（全工具），LLM 语义评审仅只读工具
agent:
  router:
    enabled: true          # 总开关，false 时一键回退全量工具路径
    llm-fallback: true     # 规则未命中时是否启用 LLM 二级路由
    llm-timeout-ms: 1500   # LLM 路由超时，超时默认 TOOL
  review:
    enabled: true            # 总开关，false 时评审全直通（一键回滚 = 现状）
    llm-timeout-ms: 2000     # LLM 评审超时，超时放行原始结果
    llm-tools: webSearch,queryEvents   # 走 LLM 语义评审的只读工具（searchKnowledge 结果为确定性知识库匹配，LLM 评审纯耗 2s 超时无收益，已移除）

# LLM 成本控制：按用户按日统计 token 用量（Redis Hash，key 保留 48h 自动清理），
# 超限后当日拒绝新的 LLM 调用（对话/重新生成/标题生成统一拦截）
token-budget:
  enabled: true
  daily-limit: 200000     # 单用户单日 token 总量（输入+输出）限额
